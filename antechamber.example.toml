# Antechamber settings. Copy to ~/.config/antechamber/config.toml (or point $ANTECHAMBER_CONFIG at it)
# and fill in your own values. Keep the real file out of git. Relative paths resolve against this file's folder.
# Validate without connecting to anything:  python3 engine/antechamber_recall.py --check

[service]                      # the local recall service (listens on 127.0.0.1 only)
port = 8790
extensions = ["mcp_http:register"]   # mounts POST /mcp; it stays off until [mcp] key is set

[mcp]
key = ""                       # or leave empty and set ANTECHAMBER_MCP_KEY in the environment

[embedder]                     # optional; without it notes and chats are searched by words only
backend = "ollama"             # or "openai" (any OpenAI-compatible /embeddings endpoint)
url = "http://localhost:11434"
model = "nomic-embed-text"
dims = 768
# api_key_env = "EMBED_KEY"    # NAME of an environment variable holding the key, never the key itself
# allow_remote_data = false    # a non-local endpoint is refused unless this is true

[index]
dir = "~/.cache/antechamber"   # one local search index per notes/chats instance
refresh_minutes = 15           # refreshed in the background, never inside a recall

[recall]
extra_seat_shelves = []        # e.g. ["vault"]: these shelves ride in extra seats beside the regular ones
extra_seats = 3

# ---- your stores: one table per instance. Ids: lower-case letters, digits, - or _; never change them.

[[adapters.notes]]
id = "notes"
name = "My notes"
folder = "~/notes"             # a folder of markdown notes (glob = "**/*.md" by default)

