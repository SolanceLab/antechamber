  <text class="small" x="512" y="229" text-anchor="middle">every shelf</text>
  <text class="small" x="512" y="252" text-anchor="middle">2. picks only</text>
  <text class="small" x="512" y="267" text-anchor="middle">the few that matter</text>
  <!-- the return: the few pages go back to your AI -->
  <path class="arrow" d="M816 108 L816 40 L590 40"/>
  <path class="head" d="M590 33 L578 40 L590 47 Z"/>
  <text class="small" x="703" y="31" text-anchor="middle">hands back only these</text>
<g transform="translate(104,90)">
  <!-- RIGHT: what your AI sees -->
