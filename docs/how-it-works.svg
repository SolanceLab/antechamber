  <text class="small" x="40" y="330">your notes, chats, memories, vault… years of it</text>

</g>
  <!-- the old way, crossed out: your AI walking the aisles itself -->
  <path class="old" d="M450 40 L210 40 L210 106"/>
  <path class="oldhead" d="M203 106 L210 118 L217 106 Z"/>
  <g class="x" stroke-width="3.5" stroke-linecap="round">
    <line x1="318" y1="28" x2="342" y2="52"/>
    <line x1="342" y1="28" x2="318" y2="52"/>
  </g>
  <text class="small" x="330" y="72" text-anchor="middle">no more walking the aisles</text>
  <!-- MIDDLE: your AI asks, Antechamber looks and picks -->
  <rect class="q" x="450" y="20" width="124" height="40" rx="8" stroke-width="1.5"/>
  <text class="label" x="512" y="45" text-anchor="middle">Your AI</text>
  <line class="arrow" x1="512" y1="60" x2="512" y2="132"/>
  <path class="head" d="M505 132 L512 144 L519 132 Z"/>
  <text class="small" x="522" y="104">asks once</text>
  <rect class="ante" x="450" y="146" width="124" height="44" rx="8" stroke-width="1.5"/>
  <text class="antetext" x="512" y="173" text-anchor="middle">Antechamber</text>
  <line class="arrow" x1="450" y1="168" x2="416" y2="168"/>
  <path class="head" d="M416 161 L404 168 L416 175 Z"/>
  <line class="arrow" x1="574" y1="168" x2="608" y2="168"/>
  <path class="head" d="M608 161 L620 168 L608 175 Z"/>
