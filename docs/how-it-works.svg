<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 470" width="1020" height="470" role="img" aria-labelledby="t d">
  <title id="t">How Antechamber works</title>
  <desc id="d">Without it, your AI would walk the aisles itself (crossed out). Your AI asks Antechamber once. Antechamber looks through everything you have, picks a few, and hands them back to your AI: many pages from your notes, chats, memories and vault. Antechamber picks. On the right, what your AI sees: your question and only a few pages, each marked with where and when it came from.</desc>
  <style>
    .bg{fill:none}
    .frame{fill:#f6f8fa;stroke:#8c959f;stroke-width:1.5;stroke-dasharray:6 5}
    .title{font:600 17px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#1f2328}
    .label{font:500 12px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#1f2328}
    .small{font:400 11px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#59636e}
    .verb{font:600 15px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#1f2328}
    .arrow{stroke:#59636e;stroke-width:2;fill:none}
    .head{fill:#59636e}
    .line{stroke:#afb8c1;stroke-width:3;stroke-linecap:round}
    .plank{stroke:#59636e;stroke-width:3;stroke-linecap:round}
    .note{fill:#dafbe1;stroke:#1a7f37}
    .chat{fill:#ddf4ff;stroke:#0969da}
    .mem{fill:#fbefff;stroke:#8250df}
    .vault{fill:#fff1e5;stroke:#bc4c00}
    .q{fill:#ffffff;stroke:#1f2328}
    .old{stroke:#afb8c1;stroke-width:2;stroke-dasharray:5 5;fill:none}.oldhead{fill:#afb8c1}.x{stroke:#cf222e}
    .note.pick{fill:#1a7f37}.chat.pick{fill:#0969da}.mem.pick{fill:#8250df}
    .ante{fill:#1f2328;stroke:#1f2328}
    .antetext{font:600 14px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#ffffff}
    .card{fill:#ffffff;stroke:#8c959f}
    @media (prefers-color-scheme: dark){
      .frame{fill:#161b22;stroke:#6e7681}
      .title,.label,.verb{fill:#e6edf3}
      .small{fill:#9198a1}
      .arrow{stroke:#9198a1}.head{fill:#9198a1}
      .line{stroke:#484f58}
      .plank{stroke:#9198a1}
      .note{fill:#0f2a17;stroke:#3fb950}
      .chat{fill:#0c2440;stroke:#4493f8}
      .mem{fill:#2a1640;stroke:#ab7df8}
      .vault{fill:#3a1d0a;stroke:#f0883e}
      .q{fill:#0d1117;stroke:#e6edf3}
      .old{stroke:#484f58}.oldhead{fill:#484f58}.x{stroke:#f85149}
      .note.pick{fill:#3fb950}.chat.pick{fill:#4493f8}.mem.pick{fill:#ab7df8}
      .ante{fill:#e6edf3;stroke:#e6edf3}
      .antetext{fill:#0d1117}
      .card{fill:#0d1117;stroke:#6e7681}
    }
  </style>

